project_id = "your-supabase-project-ref"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
site_url = "https://babacybercafe.in"
additional_redirect_urls = ["http://localhost:5173/dashboard", "https://babacybercafe.in/dashboard"]

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[functions.create-application]
verify_jwt = false

[functions.track-application]
verify_jwt = false

[functions.admin-update-application]
verify_jwt = true

[functions.admin-overview]
verify_jwt = true

[functions.admin-update-settings]
verify_jwt = true

[functions.customer-dashboard]
verify_jwt = true

[functions.import-services]
verify_jwt = true

[functions.notify-customer]
verify_jwt = true
