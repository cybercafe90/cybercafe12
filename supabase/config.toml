project_id = "dyzyfugxzsdvboxerbxv"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[auth]
enabled = true
site_url = "https://babacybercafe.in"
additional_redirect_urls = ["https://babacybercafe.in/dashboard", "https://babacybercafe.in/admin/login"]

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8
secure_password_change = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
enabled = false

