<!doctype html>
<html>
  <body style="margin:0;padding:32px;background:#f6f4ef;font-family:Arial,sans-serif;color:#25241f">
    <main style="max-width:520px;margin:auto;padding:32px;background:#fff;border:1px solid #e8e2d7;border-radius:16px">
      <p style="font-size:12px;letter-spacing:2px;color:#92733e;font-weight:bold">BABA'S CYBER CAFE</p>
      <h1 style="font-size:22px">Your one-time sign-in code</h1>
      <p>Enter this code on the BABA'S CYBER CAFE website to verify your email address.</p>
      <p style="margin:28px 0;padding:18px;text-align:center;background:#f6f4ef;border-radius:10px;font-size:30px;letter-spacing:8px;font-weight:bold">{{ .Token }}</p>
      <p>This code expires according to the account security settings. Never share it with anyone.</p>
      <p style="font-size:12px;color:#777">If you did not request this code, you can ignore this email.</p>
    </main>
  </body>
</html>
