name: CI - Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Public PostHog browser-ingestion key; never place provider secrets here.
          VITE_POSTHOG_KEY: phc_AnW9LxtnbUJMRcjuUhMTga6HTiQPvsvv9Ywq57TvvFVC
          VITE_POSTHOG_HOST: https://us.i.posthog.com

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Test shared Edge Function utilities
        run: npm run test:edge

      - name: Type-check Edge Functions
        run: npm run check:edge

  # Cloudflare Pages is connected directly to GitHub. This workflow verifies
  # source only; it intentionally does not run a second Wrangler deployment.
