name: Build and deploy Cloudflare Pages

on:
  push:
    branches: [main, feature/upi-dynamic-payment-portal]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit all production and development dependencies
        run: npm audit
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:edge
      - run: npm run check:edge
      # Cloudflare Pages is connected directly to this GitHub repository and
      # deploys each main-branch push itself. Keep this workflow as CI only;
      # a second Wrangler deploy requires separate secrets and causes false failures.
