name: Smart QR preview checks
on:
  push:
    branches:
      - preview/smart-qr-merchant-platform
    paths:
      - "src/pages/SmartQr*"
      - "src/App.tsx"
      - "migrations/smartqr-d1.sql"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/smart-qr-preview-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/smart-qr-merchant-platform
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build preview
        run: npm run build
