name: Dependency security audit

on:
  push:
    branches: [dependency-audit-review-20261107]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply npm's proposed dev-toolchain security remediation on this branch
        run: npm audit fix --force
      - name: Require a clean full dependency audit
        run: npm audit
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:edge
      - run: npm run check:edge
      - name: Commit tested dependency remediation to this branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/dependency-audit-review-20261107'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Fix vulnerable development toolchain dependencies"
            git push origin HEAD:dependency-audit-review-20261107
          else
            echo "No dependency changes to commit."
          fi
